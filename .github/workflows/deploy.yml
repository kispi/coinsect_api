name: Deploy to EC2

# 구 방식은 서버에 SSH로 들어가 git pull -> npm install -> npm run build를 서버에서 돌렸다.
# 이제 빌드는 러너에서 끝내고 산출물만 서버로 복사한다(coinsect_web/coinsect_nuxt와 같은 방식).
# 서버는 메모리가 작아 빌드가 가장 무거운 단계였고, 서버에서 git pull을 하지 않으므로 배포된
# 산출물과 커밋의 대응이 러너 쪽 체크아웃 하나로 고정된다.
#
# 서버에는 런타임 의존성이 여전히 필요하다(dist/는 의존성을 번들링하지 않는다). 그래서
# 서버에서 npm ci --omit=dev만 돌린다 - 구 스크립트의 npm install --include=dev와 달리
# devDependencies는 받지 않는다. 빌드가 러너로 옮겨가 서버에는 더 이상 필요 없기 때문이다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ormconfig.ts는 .gitignore에 있다(DB 자격증명이 들어 있다). 서버에서 빌드할 때는 서버에
      # 놓인 파일이 그대로 쓰였지만, 러너 체크아웃에는 없어서 tsc가 database.ts의 import를
      # 풀지 못한다(TS2307). coinsect_frontend가 .env.production을 EC2_ENV_PRODUCTION 시크릿에서
      # 만들어 쓰는 것과 같은 처리다.
      #
      # ⚠️ 이 시크릿에는 **서버에 있던 프로덕션 ormconfig.ts**가 들어 있어야 한다. 개발용
      # 사본을 넣으면 tsc가 그 값을 dist/ormconfig.js에 그대로 구워 넣어, 프로덕션이 엉뚱한
      # DB를 보게 된다(로컬 사본과 서버 사본은 실제로 내용이 달랐다).
      - name: Create ormconfig.ts
        run: echo "${{ secrets.EC2_ORMCONFIG }}" > ormconfig.ts

      - name: Build
        run: npm run build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
        run: |
          REMOTE_DIR="~/web/coinsect_api"
          SSH_CMD="ssh -i ~/.ssh/deploy_key ${EC2_USERNAME}@${EC2_HOST}"
          SCP_CMD="scp -i ~/.ssh/deploy_key"

          tar czf deploy.tar.gz dist/ package.json package-lock.json
          ${SCP_CMD} deploy.tar.gz ${EC2_USERNAME}@${EC2_HOST}:${REMOTE_DIR}/deploy.tar.gz

          # 스테이징 디렉터리에 먼저 푼 뒤 갈아끼운다. tar를 산출물 위에 바로 풀면 이번 빌드에서
          # 사라진 옛 파일이 그대로 남아(tar는 지우지 않는다) 산출물이 두 커밋의 잡탕이 된다.
          ${SSH_CMD} << 'ENDSSH'
            set -e
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"

            cd ~/web/coinsect_api
            rm -rf deploy_staging
            mkdir deploy_staging
            tar xzf deploy.tar.gz -C deploy_staging

            rm -rf dist
            mv deploy_staging/dist dist
            mv deploy_staging/package.json deploy_staging/package-lock.json .
            rm -rf deploy_staging deploy.tar.gz

            npm ci --omit=dev
            pm2 restart coinsect_api || pm2 start npm --name "coinsect_api" -- run prod
            pm2 save
          ENDSSH

      # gukto 레포들이 쓰던 알림 단계와 같은 채널·같은 시크릿 이름을 쓴다.
      # if: always()라 실패한 배포도 알린다 - 성공만 알리면 조용한 실패가 성공과 구분되지 않는다.
      - name: Notify Slack
        if: always()
        env:
          EC2_SLACK_API_KEY: ${{ secrets.EC2_SLACK_API_KEY }}
          EC2_SLACK_CHANNEL_GUKTO_API: ${{ secrets.EC2_SLACK_CHANNEL_GUKTO_API }}
          JOB_STATUS: ${{ job.status }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ -z "${EC2_SLACK_API_KEY}" || -z "${EC2_SLACK_CHANNEL_GUKTO_API}" ]]; then
            echo "Slack secrets are missing; skipping notification."
            exit 0
          fi

          short_sha="${COMMIT_SHA:0:7}"
          first_line="$(printf '%s\n' "${COMMIT_MESSAGE}" | head -n 1)"
          if [[ "${JOB_STATUS}" == "success" ]]; then
            title=":white_check_mark: coinsect_api *deploy succeeded*"
          else
            title=":x: coinsect_api *deploy failed*"
          fi

          text="$(
            cat <<EOF
          ${title}
          Commit: <${COMMIT_URL}|${short_sha}> ${first_line}
          Run: <${RUN_URL}|GitHub Actions>
          EOF
          )"

          payload="$(jq -n --arg channel "${EC2_SLACK_CHANNEL_GUKTO_API}" --arg text "${text}" '{channel: $channel, text: $text}')"
          response="$(curl -fsS -X POST "https://slack.com/api/chat.postMessage" \
            -H "Authorization: Bearer ${EC2_SLACK_API_KEY}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "${payload}")"

          if [[ "$(jq -r '.ok' <<< "${response}")" != "true" ]]; then
            echo "::error::Slack notification failed: ${response}"
            exit 1
          fi
